name: Build and Deploy

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Generate image tags
        id: image-tags
        run: |
          TAGS="ghcr.io/${{ env.REPO }}:latest,ghcr.io/${{ env.REPO }}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.REPO }}:${{ github.ref_name }}"
          fi
          if [ "${{ secrets.DOCKERHUB_USERNAME }}" != "" ]; then
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/aura:latest,${{ secrets.DOCKERHUB_USERNAME }}/aura:${{ github.sha }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

  deploy:
    needs: build-and-push
    if: github.ref_type == 'tag'
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          mkdir -p ~/docker/aura/data ~/docker/aura/user_credentials ~/docker/aura/qdrant_storage ~/docker/aura/redis_data
          if [ ! -f ~/docker/aura/config.yaml ]; then
            touch ~/docker/aura/config.yaml
          fi
          printf 'IMAGE=ghcr.io/oscarhickman/aura\nTAG=%s\n' "$TAG" > ~/docker/aura/.env
          cd ~/docker/aura
          docker compose pull
          docker compose up -d
