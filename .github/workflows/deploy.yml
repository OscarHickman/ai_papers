name: Build and Deploy

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Generate image tags
        id: image-tags
        run: |
          TAGS="ghcr.io/${{ env.REPO }}:latest,ghcr.io/${{ env.REPO }}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.REPO }}:${{ github.ref_name }}"
          fi
          if [ "${{ secrets.DOCKERHUB_USERNAME }}" != "" ]; then
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/aura:latest,${{ secrets.DOCKERHUB_USERNAME }}/aura:${{ github.sha }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

  deploy:
    needs: build-and-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-aura

      - name: Deploy to home server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: 100.88.127.35
          RELEASE_TAG: ${{ github.ref_name }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa $SSH_USER@$HOST "mkdir -p ~/docker/aura/data ~/docker/aura/user_credentials ~/docker/aura/qdrant_storage ~/docker/aura/redis_data"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa deploy/docker-compose.yml $SSH_USER@$HOST:~/docker/aura/docker-compose.yml
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa $SSH_USER@$HOST "
            set -x
            if [ -n \"$GHCR_PAT\" ]; then
              echo \"$GHCR_PAT\" | docker login ghcr.io -u oscarhickman --password-stdin || true
            fi
            cd ~/docker/aura
            touch .env
            if [ ! -f config.yaml ]; then
              touch config.yaml
            fi
            sed -i '/^TAG=/d' .env 2>/dev/null || true
            echo \"TAG=$RELEASE_TAG\" >> .env
            docker image prune -af --filter "until=24h" || true
            docker builder prune -f || true
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f || true
          "


